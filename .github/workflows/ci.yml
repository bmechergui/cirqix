name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Mesure à la demande : le job kicad-docker rejoue la fixture
  # led-blinker-full-pipeline sur la branche choisie. Ajouté parce que la mesure
  # n'était déclenchable que par une PR touchant un submodule — impossible donc
  # de mesurer `main` une fois le bump mergé, ce qui a bloqué le diagnostic de
  # l'issue #72. Utile aussi pour vérifier l'état du pipeline sans attendre une PR.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager field in package.json — do not set version here
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test

  kicad-docker:
    name: KiCad Docker Build
    runs-on: ubuntu-latest
    # `contents: read` est hérité du workflow ; ce job publie en plus la mesure
    # du pipeline en commentaire sur les PR de bump de submodule (fin de job).
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Deploy keys SSH pour cloner les submodules privés bmechergui/kicad-tools
      # et bmechergui/circuit-synth (privé depuis le 2026-07-18) — rewrite
      # chirurgical : SEULES les URLs des submodules passent en SSH, le checkout
      # principal cirqix reste inchangé. Deux deploy keys ne peuvent pas partager
      # l'hôte github.com (GitHub fige l'identité sur la 1re clé acceptée, et une
      # deploy key = 1 seul repo) → alias SSH dédié pour circuit-synth.
      - name: Configure SSH deploy keys (private submodules kicad-tools + circuit-synth)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SUBMODULE_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.CIRCUIT_SYNTH_DEPLOY_KEY }}" > ~/.ssh/id_circuit_synth
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/id_circuit_synth
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host github.com-circuit-synth"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile ~/.ssh/id_circuit_synth"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
          git config --global url."git@github.com:bmechergui/kicad-tools.git".insteadOf "https://github.com/bmechergui/kicad-tools.git"
          git config --global url."git@github.com-circuit-synth:bmechergui/circuit-synth.git".insteadOf "https://github.com/bmechergui/circuit-synth.git"

      - uses: actions/checkout@v4
        with:
          # actions/checkout recursively walks initialized repositories while
          # persisting credentials. Circuit-Synth has optional historical
          # gitlinks, so initialize only Cirqix's two direct submodules below.
          submodules: false
          persist-credentials: false

      - name: Checkout pinned direct KiCad submodules
        run: |
          git submodule sync -- services/kicad/kicad-tools services/kicad/circuit_synth
          git submodule update --init --depth=1 -- services/kicad/kicad-tools services/kicad/circuit_synth

      - name: Remove private submodule credentials
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/id_circuit_synth
          git config --global --unset-all url."git@github.com:bmechergui/kicad-tools.git".insteadOf || true
          git config --global --unset-all url."git@github.com-circuit-synth:bmechergui/circuit-synth.git".insteadOf || true

      - name: Verify pinned KiCad build sources
        run: python3 -m unittest services.kicad.tests.test_docker_build_context -v

      - name: Build KiCad Docker image
        run: docker build -t cirqix-kicad:test ./services/kicad

      - name: Test KiCad service security boundary
        run: >-
          docker run --rm --entrypoint python3 cirqix-kicad:test
          -m unittest tests.test_service_security -v

      - name: Test Circuit-Synth regression patches
        run: >-
          docker run --rm --entrypoint python3 cirqix-kicad:test
          -m unittest discover -s /app/circuit_synth/tests/unit
          -p 'test_cirqix_*.py' -v

      # Les 180 tests pytest du service ne tournaient NULLE PART en CI : ce job
      # ne lançait que test_service_security et les régressions Circuit-Synth,
      # et `pnpm turbo test` ne couvre que le TypeScript. C'est ce trou qui a
      # laissé passer le bump #69 — `test_auto_place_result_has_no_error_conflicts`
      # échoue 3 fois sur 3 avec kicad-tools 0.18.0 (issue #72), sans que rien
      # ne le signale. On les exécute dans l'image, seul endroit où pcbnew et
      # kicad-tools sont installés.
      #
      # Deux exclusions, chacune parce que le contexte du conteneur diffère :
      #   - test_docker_build_context vérifie des chemins relatifs à la RACINE
      #     du dépôt ; dans l'image le layout est /app, sa COLLECTE lève
      #     IndexError. Il tourne déjà à l'étape « Verify pinned KiCad build
      #     sources », sur le runner, là où il a du sens.
      #   - -p no:cacheprovider : /app n'est pas inscriptible par l'utilisateur
      #     du conteneur (PytestCacheWarning, Errno 13).
      - name: Suite pytest du service KiCad
        run: >-
          docker run --rm --entrypoint python3 cirqix-kicad:test
          -m pytest tests/ -q -p no:cacheprovider
          --ignore=tests/test_docker_build_context.py

      - name: Test /health endpoint
        run: |
          set -euo pipefail
          docker run -d --name kicad-test cirqix-kicad:test
          trap 'docker rm -f kicad-test >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 36); do
            state=$(docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' kicad-test)
            case "$state" in
              "running healthy") exit 0 ;;
              *" unhealthy"|"exited "*)
                docker logs kicad-test
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "KiCad service did not become healthy within 180 seconds"
          docker logs kicad-test
          exit 1

      # ── Porte 3+ : le board, pas seulement le build ────────────────────────
      # Une CI verte sur une PR de bump de submodule ne dit que « ça compile ».
      # Elle ne dit RIEN du board produit. Mesuré le 2026-07-28 : kicad-tools
      # 0.18.0 s'installe et compile parfaitement, mais refuse désormais de
      # router un placement dont des composants sortent du contour
      # (« 7 footprint(s) outside Edge.Cuts — placement invalid ») — un
      # changement de comportement qu'aucun test unitaire ne voit.
      #
      # Ces étapes rejouent la fixture led-blinker-full-pipeline contre l'image
      # fraîchement construite et publient les chiffres sur la PR, pour que la
      # Porte 4 (merge humain) s'appuie sur des faits et non sur « c'est vert ».
      - name: Décider si la mesure du pipeline doit tourner
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        id: detect_submodule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Déclenchement manuel : on mesure la branche telle quelle, sans
          # condition. C'est le seul moyen de mesurer `main` après le merge d'un
          # bump — il n'y a plus de PR à inspecter (cf. issue #72).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sur PR : via l'API plutôt que git diff, le checkout étant en
          # --depth=1 (la base n'est pas dans l'historique local).
          if gh pr view "${{ github.event.pull_request.number }}" --json files \
               --jq '.files[].path' \
             | grep -qE '^services/kicad/(kicad-tools|circuit_synth)$'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rejouer le pipeline complet (3 runs)
        if: steps.detect_submodule.outputs.touched == 'true'
        id: pipeline_runs
        run: |
          set -euo pipefail
          # Le service exige un token d'au moins 32 caractères (security.py) —
          # un token trop court fait démarrer le conteneur, le rend « healthy »
          # (/health est public) et renvoie 503 sur TOUT le reste.
          TOKEN="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          docker rm -f kicad-fixture >/dev/null 2>&1 || true
          docker run -d --name kicad-fixture -p 127.0.0.1:8766:8766 \
            -e KICAD_SERVICE_TOKEN="$TOKEN" \
            -e KICAD_SYMBOL_DIR=/usr/share/kicad/symbols \
            -e KICAD_FOOTPRINT_DIR=/usr/share/kicad/footprints \
            -e FREEROUTING_API_URL=http://127.0.0.1:37864 \
            cirqix-kicad:test
          # PAS de `trap ... EXIT` ici : chaque étape GitHub Actions est un shell
          # SÉPARÉ, donc le trap détruirait le conteneur à la fin de CETTE étape
          # et les étapes d'analyse suivantes ne le trouveraient plus
          # (« No such container: kicad-fixture », run 30403853465 — l'étape même
          # qui devait nommer les nets fautifs). La destruction est faite en fin
          # de job, dans une étape dédiée en always().

          for attempt in $(seq 1 48); do
            if curl -fsS -m 5 http://127.0.0.1:8766/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" = "48" ]; then
              echo "::error::Le service KiCad n'est pas devenu sain en 240 s"
              docker logs kicad-fixture | tail -40
              exit 1
            fi
            sleep 5
          done

          cd services/kicad/examples/led-blinker-full-pipeline
          : > /tmp/summaries.txt
          for i in 1 2 3; do
            PYTHONUTF8=1 KICAD_SERVICE_URL=http://127.0.0.1:8766 \
            KICAD_SERVICE_TOKEN="$TOKEN" \
              python3 run_pipeline.py "/tmp/fixture-run-$i" 2>&1 \
              | tee "/tmp/run-$i.log" | grep '^SUMMARY' \
              | sed "s/^/run$i /" >> /tmp/summaries.txt || {
                echo "run$i ECHEC — pipeline interrompu" >> /tmp/summaries.txt
                tail -20 "/tmp/run-$i.log" || true
              }
          done
          cat /tmp/summaries.txt

          # Le placement GA est stochastique et sans seed : un seul run ne
          # prouve rien, d'où les 3. On ne fait PAS échouer le job sur un board
          # non DRC-clean — c'est une mesure à relire, pas une porte.
          CLEAN=$(grep -c 'drc_clean=True' /tmp/summaries.txt || true)
          echo "clean_runs=$CLEAN" >> "$GITHUB_OUTPUT"
          {
            echo 'summaries<<EOF'
            cat /tmp/summaries.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"


      # Uniquement sur PR : un déclenchement manuel n'a pas de PR où commenter,
      # ses chiffres sont dans le log du job et dans l'artefact.
      - name: Publier la mesure sur la PR
        if: always() && steps.detect_submodule.outputs.touched == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEAN_RUNS: ${{ steps.pipeline_runs.outputs.clean_runs }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Corps écrit dans un fichier : un heredoc imbriqué dans le scalaire
          # YAML casse le parsing (le délimiteur en colonne 0 ferme le bloc).
          {
            echo "### Pipeline complet rejoué sur cette PR"
            echo
            echo "Fixture \`led-blinker-full-pipeline\`, 3 runs contre l'image construite ici."
            echo "**${CLEAN_RUNS:-0}/3 runs DRC-clean.**"
            echo
            echo '```'
            cat /tmp/summaries.txt 2>/dev/null || echo "(aucune mesure — le pipeline n'a pas abouti)"
            echo '```'
            echo
            echo "Le placement GA est stochastique et sans seed : la référence sur \`main\` est"
            echo "**2 runs clean sur 3** (mesure du 2026-07-28). Un résultat inférieur mérite"
            echo "d'être creusé avant merge ; il ne fait pas échouer la CI de lui-même."
          } > /tmp/pr_comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr_comment.md

      # Sans les boards, la mesure donne un CHIFFRE mais pas de CAUSE. Constaté
      # sur la PR #69 (issue #72) : 30 unconnected_items reproductibles, sans
      # moyen de savoir lesquels — GND, VCC, ou un net de signal ? — ce qui
      # aurait tranché immédiatement. On nomme donc les nets ici, et on archive
      # les boards pour toute analyse ultérieure.
      - name: Détailler les nets non connectés (run 1)
        if: always() && steps.detect_submodule.outputs.touched == 'true'
        run: |
          set -uo pipefail
          BOARD=/tmp/fixture-run-1/6_routed.kicad_pcb
          if [ ! -f "$BOARD" ]; then
            echo "Pas de board routé au run 1 — rien à détailler."
            exit 0
          fi
          docker cp "$BOARD" kicad-fixture:/tmp/analyse.kicad_pcb
          docker exec kicad-fixture kicad-cli pcb drc /tmp/analyse.kicad_pcb -o /tmp/analyse.json --format json --severity-all --refill-zones >/dev/null 2>&1 || true
          # Script en une ligne : un heredoc imbriqué ici casserait le scalaire
          # YAML (son délimiteur en colonne 0 ferme le bloc).
          docker exec kicad-fixture python3 -c 'import json, collections; d=json.load(open("/tmp/analyse.json")); v=d.get("violations",[]); u=d.get("unconnected_items",[]); print("violations=%d unconnected_items=%d" % (len(v), len(u))); [print("  violation %s x%d" % (k,n)) for k,n in collections.Counter(x.get("type") for x in v).most_common()]; nets=collections.Counter(i.get("description","").split("[",1)[1].split("]",1)[0] for x in u for i in x.get("items",[]) if "[" in i.get("description","")); [print("  net non connecte %s x%d" % (k,n)) for k,n in nets.most_common(10)]' 2>&1 | grep -v m_choices || true

      - name: Archiver les boards de la mesure
        if: always() && steps.detect_submodule.outputs.touched == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fixture-boards
          path: |
            /tmp/fixture-run-*/*.kicad_pcb
            /tmp/fixture-run-*/*.kicad_sch
            /tmp/run-*.log
          if-no-files-found: warn
          retention-days: 14

      # Le conteneur de mesure survit à toutes les étapes d'analyse ci-dessus ;
      # il est détruit ici, une fois pour toutes.
      - name: Nettoyer le conteneur de mesure
        if: always()
        run: docker rm -f kicad-fixture >/dev/null 2>&1 || true

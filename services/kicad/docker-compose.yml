services:
  kicad:
    build:
      context: .
      dockerfile: Dockerfile
      # circuit_synth/ + kicad-tools/ sont copiés dans l'image (fallback prod sans mount).
      # En dev, seuls les fichiers FastAPI ci-dessous restent visibles en direct.
    image: cirqix-kicad:latest
    container_name: cirqix-kicad
    ports:
      - '127.0.0.1:8766:8766'
    volumes:
      - kicad-jobs:/tmp/kicad-jobs
      # Code du service FastAPI éditable live (reasoner, routers…). Restart du conteneur
      # pour prise en compte (uvicorn --workers, pas de --reload pour rester thread-safe).
      - ./tools:/app/tools:ro
      - ./routers:/app/routers:ro
      - ./main.py:/app/main.py:ro
      - ./security.py:/app/security.py:ro
      # Importé par main.py (init_sentry). Sans ce montage, le main.py monté
      # ci-dessus importe un module absent de l'image : ModuleNotFoundError,
      # les 4 workers meurent au démarrage et AUCUNE route n'est servie.
      - ./observability.py:/app/observability.py:ro
    environment:
      - PYTHONUNBUFFERED=1
      - KICAD_SYMBOL_DIR=/usr/share/kicad/symbols
      - KICAD_FOOTPRINT_DIR=/usr/share/kicad/footprints
      - FREEROUTING_API_URL=http://127.0.0.1:37864
      # Obligatoire pour toutes les routes sauf /health. `:?` empêche un
      # démarrage local accidentel avec une API privilégiée non protégée.
      - KICAD_SERVICE_TOKEN=${KICAD_SERVICE_TOKEN:?KICAD_SERVICE_TOKEN must be set}
      # Reasoner IA (call_agent_reason → PCBReasoningAgent + Claude Haiku). Sans cette
      # clé, le service retombe sur `kct reason --auto-route` (heuristique sans LLM).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8766/health']
      interval: 30s
      timeout: 10s
      retries: 3
      # Xvfb, Freerouting and KiCad can take time to initialize.
      start_period: 180s

  # ---------------------------------------------------------------------------
  # File d'attente des jobs PCB (migration asynchrone, étape 1).
  # ---------------------------------------------------------------------------
  #
  # Pourquoi un Redis local et PAS Upstash, déjà utilisé par le rate limiting :
  # BullMQ s'appuie sur des commandes BLOQUANTES (BZPOPMIN, BRPOPLPUSH) qu'un
  # worker au repos répète en boucle. Sur une tarification à la commande, c'est
  # un coût permanent pour zéro travail. Upstash reste en place pour ce qu'il
  # fait bien — le rate limiting HTTP REST depuis Vercel. Deux Redis, deux rôles
  # disjoints, assumé.
  #
  # `noeviction` est CRITIQUE : sous toute autre politique, Redis évincerait des
  # clés sous pression mémoire — donc des jobs. Un PCB perdu en silence.
  redis:
    image: redis:7-alpine
    container_name: cirqix-redis
    command: >-
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    # Aucun port publié : seul le worker y accède, par le réseau Docker interne.
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Worker de pipeline PCB — en VEILLE à l'étape 1.
  # ---------------------------------------------------------------------------
  #
  # Il ne consomme encore aucun job : cette étape ne change aucun comportement.
  # Le pipeline continue de tourner dans l'invocation Next.js jusqu'à l'étape 3.
  #
  # Colocalisé avec le service KiCad, et c'est la raison principale : `kicad`
  # n'écoute que sur 127.0.0.1:8766, donc il n'est pas exposé sur Internet.
  # Héberger le worker ailleurs (Railway, Vercel) obligerait à publier une API
  # qui accepte des .kicad_pcb et exécute du calcul lourd. Ici, le worker parle
  # à KiCad par le réseau interne et KICAD_SERVICE_TOKEN ne quitte pas la machine.
  #
  # Aucun port publié : le navigateur ne joint JAMAIS le worker. La progression
  # transite par Postgres (`pcb_run_events`, migration 019) lu en Supabase
  # Realtime — c'est ce qui permet au worker de rester sans surface réseau.
  worker:
    image: node:20-alpine
    container_name: cirqix-worker
    working_dir: /app
    # Étape 1 : le conteneur existe et reste sain, sans consommer la file.
    # Remplacé par le vrai point d'entrée à l'étape 3.
    command: ['sh', '-c', 'echo "worker en veille (etape 1)"; tail -f /dev/null']
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - KICAD_SERVICE_URL=http://kicad:8766
      - KICAD_SERVICE_TOKEN=${KICAD_SERVICE_TOKEN:?KICAD_SERVICE_TOKEN must be set}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'true']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kicad-jobs:
  redis-data:
